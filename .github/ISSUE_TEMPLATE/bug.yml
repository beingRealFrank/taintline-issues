name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: ide
    attributes: { label: IDE and version, placeholder: "IntelliJ IDEA 2026.3" }
    validations: { required: true }
  - type: input
    id: plugin
    attributes: { label: Plugin version }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: sample
    attributes: { label: Small example file or steps to reproduce }
